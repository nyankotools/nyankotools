name: Setup
description: pnpm / Node のセットアップ、依存インストール、OGP描画キャッシュの復元

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash

    # ツール別OGP画像の描画キャッシュ（scripts/ogp/generate.mjs）。キャッシュなしだと
    # ビルドごとに約45秒かかるため、内容が変わらない限り再利用する。
    - uses: actions/cache@v6
      with:
        path: node_modules/.cache/ogp
        key: ogp-${{ hashFiles('src/data/tools.ts', 'scripts/ogp/generate.mjs', 'public/logo.png', 'pnpm-lock.yaml') }}
        restore-keys: ogp-
