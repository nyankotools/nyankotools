name: CI

# developのpushではCIを動かさない。developからmainへのPRをマージ（マージコミット）したとき
# だけCI（test / e2e）を実行し、両方成功したらdeployジョブで本番へデプロイする。
on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec prettier --check .

      - run: pnpm run lint

      - run: pnpm exec astro check

      - run: pnpm test

      - run: pnpm build

      # ページ別JSバンドルサイズの予算チェック（重いライブラリの意図しない混入を検知）
      - run: pnpm run check:bundle

  # ブラウザ上の挙動（DOM配線・日英表示・375px・CSP実配信）を確認するE2E。
  # lint/型/単体テストのジョブとは独立して並列実行し、失敗時の切り分けを容易にする。
  e2e:
    runs-on: ubuntu-latest
    # テスト数の増加で単一ジョブだと25分を超えたため、3分割（shard）して並列実行する。
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # ブラウザ本体のダウンロードを省くため、Playwrightのバージョンをキーにキャッシュする。
      # OS依存パッケージ（--with-deps）はキャッシュ対象外なので、下のinstallは毎回実行する
      # （キャッシュがヒットすればブラウザのダウンロードだけがスキップされる）。
      - id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - run: pnpm exec playwright install --with-deps chromium

      # webServer（pnpm build && pnpm preview --port 4322）と、CSP/サイドバー永続化specのwrangler devは
      # playwright.config.ts / 各specが自動で起動する。
      # 実行時間の偏りを避けるため、全体の約半分を占める tools-common.spec.ts を各シャードに等分し、
      # 残りのspecも同じシャード番号で等分する（1回目でビルド済みなので2回目はビルドを省略する）。
      - run: pnpm run test:e2e tools-common.spec.ts --shard=${{ matrix.shard }}/3

      - run: pnpm run test:e2e --shard=${{ matrix.shard }}/3 --output=test-results-rest
        if: ${{ !cancelled() }}
        env:
          E2E_EXCLUDE_COMMON: '1'
          E2E_SKIP_BUILD: '1'
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-rest

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            playwright-report-rest/
            test-results/
            test-results-rest/
          retention-days: 7

  # test / e2e がともに成功したときだけ、Cloudflare Workers（静的アセット）へデプロイする。
  # wrangler.jsonc の build.command により、デプロイ時に pnpm build が実行される。
  deploy:
    needs: [test, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
