name: CI

# developのpushではCIを動かさない。ローカルでmainにマージしてpushしたときだけ
# CI（test / e2e）を実行し、両方成功したらdeployジョブで本番へデプロイする。
on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      - run: pnpm exec astro check

      - run: pnpm test

      - run: pnpm build

      # ページ別JSバンドルサイズの予算チェック（重いライブラリの意図しない混入を検知）
      - run: pnpm run check:bundle

  # ブラウザ上の挙動（DOM配線・日英表示・375px・CSP実配信）を確認するE2E。
  # lint/型/単体テストのジョブとは独立して並列実行し、失敗時の切り分けを容易にする。
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      # webServer（pnpm build && pnpm preview --port 4322）と、CSP/サイドバー永続化specのwrangler devは
      # playwright.config.ts / 各specが自動で起動する。
      - run: pnpm run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # test / e2e がともに成功したときだけ、Cloudflare Workers（静的アセット）へデプロイする。
  # wrangler.jsonc の build.command により、デプロイ時に pnpm build が実行される。
  deploy:
    needs: [test, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
